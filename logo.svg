<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue rounded square background -->
  <rect x="0" y="0" width="200" height="200" rx="34" ry="34" fill="#2C5EE8"/>

  <!-- Top-left: B -->
  <text x="8" y="96"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-weight="900"
        font-size="86"
        fill="white">B</text>

  <!-- Top-right: M -->
  <text x="102" y="96"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-weight="900"
        font-size="86"
        fill="white">M</text>

  <!-- Arrow cut through the M in background blue (negative space effect) -->
  <!-- zigzag: dips down then shoots upper-right through the M body -->
  <polyline
    points="116,76  138,92  176,26"
    stroke="#2C5EE8" stroke-width="12"
    fill="none"
    stroke-linejoin="round" stroke-linecap="round"/>
  <!-- arrowhead in blue -->
  <polyline
    points="162,20  176,26  170,40"
    stroke="#2C5EE8" stroke-width="12"
    fill="none"
    stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Horizontal divider -->
  <line x1="8" y1="104" x2="192" y2="104" stroke="white" stroke-width="3"/>

  <!-- Bottom-left: B -->
  <text x="8" y="192"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-weight="900"
        font-size="86"
        fill="white">B</text>

  <!-- Bottom-right: D -->
  <text x="102" y="192"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-weight="900"
        font-size="86"
        fill="white">D</text>
</svg>
