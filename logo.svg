<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue rounded square background -->
  <rect width="200" height="200" rx="36" ry="36" fill="#0057FF"/>

  <!-- Top-left: B -->
  <text x="13" y="93"
        font-family="'Arial Black', Arial, sans-serif"
        font-weight="900" font-size="86" fill="white">B</text>

  <!-- Top-right: M with trending arrow chart cutout -->
  <text x="106" y="93"
        font-family="'Arial Black', Arial, sans-serif"
        font-weight="900" font-size="86" fill="white">M</text>
  <!-- Blue diagonal strip cutting through M (simulates the chart trend line) -->
  <line x1="118" y1="83" x2="183" y2="22"
        stroke="#0057FF" stroke-width="17" stroke-linecap="round"/>
  <!-- White arrow above the M pointing up-right -->
  <polyline points="170,18 187,8 197,8 197,20"
            fill="none" stroke="white" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom-left: B -->
  <text x="13" y="187"
        font-family="'Arial Black', Arial, sans-serif"
        font-weight="900" font-size="86" fill="white">B</text>

  <!-- Bottom-right: D -->
  <text x="106" y="187"
        font-family="'Arial Black', Arial, sans-serif"
        font-weight="900" font-size="86" fill="white">D</text>
</svg>
