<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" fill="none">

  <!-- Background -->
  <rect width="640" height="500" fill="#0F0E0A"/>

  <!-- Subtle perspective grid lines -->
  <line x1="0" y1="250" x2="640" y2="250" stroke="#FFBD59" stroke-width="0.4" opacity="0.06"/>
  <line x1="0" y1="200" x2="640" y2="200" stroke="#FFBD59" stroke-width="0.4" opacity="0.04"/>
  <line x1="0" y1="300" x2="640" y2="300" stroke="#FFBD59" stroke-width="0.4" opacity="0.04"/>
  <line x1="0" y1="150" x2="640" y2="150" stroke="#FFBD59" stroke-width="0.3" opacity="0.025"/>
  <line x1="0" y1="350" x2="640" y2="350" stroke="#FFBD59" stroke-width="0.3" opacity="0.025"/>
  <line x1="320" y1="0" x2="320" y2="500" stroke="#FFBD59" stroke-width="0.4" opacity="0.05"/>

  <!-- === LEFT SIDE: Growth / Data === -->

  <!-- Chart axes -->
  <line x1="90" y1="380" x2="280" y2="380" stroke="#FFBD59" stroke-width="1" opacity="0.25"/>
  <line x1="90" y1="380" x2="90"  y2="160" stroke="#FFBD59" stroke-width="1" opacity="0.25"/>

  <!-- Bars (gradient opacity = growth) -->
  <rect x="106" y="330" width="26" height="50" fill="#FFBD59" opacity="0.12" rx="1"/>
  <rect x="142" y="295" width="26" height="85" fill="#FFBD59" opacity="0.18" rx="1"/>
  <rect x="178" y="255" width="26" height="125" fill="#FFBD59" opacity="0.25" rx="1"/>
  <rect x="214" y="210" width="26" height="170" fill="#FFBD59" opacity="0.35" rx="1"/>
  <rect x="250" y="178" width="26" height="202" fill="#FFBD59" opacity="0.5"  rx="1"/>

  <!-- Glow on tallest bar -->
  <rect x="249" y="177" width="28" height="204" fill="none" stroke="#FFBD59" stroke-width="0.8" opacity="0.4" rx="2"/>

  <!-- Trend line -->
  <polyline
    points="119,325 155,290 191,249 227,205 263,172"
    stroke="#FFBD59" stroke-width="2.2" fill="none" opacity="0.95"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Trend dots -->
  <circle cx="119" cy="325" r="3.5" fill="#FFBD59" opacity="0.9"/>
  <circle cx="155" cy="290" r="3.5" fill="#FFBD59" opacity="0.9"/>
  <circle cx="191" cy="249" r="3.5" fill="#FFBD59" opacity="0.9"/>
  <circle cx="227" cy="205" r="3.5" fill="#FFBD59" opacity="0.9"/>
  <!-- Highlight dot -->
  <circle cx="263" cy="172" r="6"   fill="#FFBD59" opacity="1"/>
  <circle cx="263" cy="172" r="11"  fill="#FFBD59" opacity="0.12"/>

  <!-- Arrow up -->
  <line x1="263" y1="148" x2="263" y2="168" stroke="#FFBD59" stroke-width="2" opacity="0.75" stroke-linecap="round"/>
  <polyline points="256,157 263,147 270,157" stroke="#FFBD59" stroke-width="2" fill="none" opacity="0.75" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Axis tick labels -->
  <text x="100" y="398" font-family="'DM Sans',sans-serif" font-size="7" fill="#FFBD59" opacity="0.35" letter-spacing="1.5">Q1</text>
  <text x="136" y="398" font-family="'DM Sans',sans-serif" font-size="7" fill="#FFBD59" opacity="0.35" letter-spacing="1.5">Q2</text>
  <text x="172" y="398" font-family="'DM Sans',sans-serif" font-size="7" fill="#FFBD59" opacity="0.35" letter-spacing="1.5">Q3</text>
  <text x="208" y="398" font-family="'DM Sans',sans-serif" font-size="7" fill="#FFBD59" opacity="0.35" letter-spacing="1.5">Q4</text>
  <text x="244" y="398" font-family="'DM Sans',sans-serif" font-size="7" fill="#FFBD59" opacity="0.5"  letter-spacing="1.5">NOW</text>

  <!-- Section label -->
  <text x="90" y="434" font-family="'DM Sans',sans-serif" font-size="8" font-weight="700" letter-spacing="2.5" fill="#FFBD59" opacity="0.4">GROWTH TRAJECTORY</text>

  <!-- === CENTRE DIVIDER === -->
  <line x1="330" y1="80" x2="330" y2="430" stroke="#FFBD59" stroke-width="0.6" opacity="0.18" stroke-dasharray="6,5"/>

  <!-- === RIGHT SIDE: People / Collaboration === -->

  <!-- Person 1 -->
  <!-- Head -->
  <circle cx="416" cy="178" r="30" stroke="#FFBD59" stroke-width="1.5" fill="rgba(255,189,89,0.04)" opacity="0.75"/>
  <!-- Shoulders / torso -->
  <path d="M385,208 Q416,216 447,208 L456,290 Q416,300 376,290 Z"
        stroke="#FFBD59" stroke-width="1.5" fill="rgba(255,189,89,0.04)" opacity="0.75"/>

  <!-- Person 2 -->
  <circle cx="536" cy="178" r="30" stroke="#FFBD59" stroke-width="1.5" fill="rgba(255,189,89,0.04)" opacity="0.75"/>
  <path d="M505,208 Q536,216 567,208 L576,290 Q536,300 496,290 Z"
        stroke="#FFBD59" stroke-width="1.5" fill="rgba(255,189,89,0.04)" opacity="0.75"/>

  <!-- Shared document between them -->
  <rect x="453" y="235" width="72" height="58" rx="3"
        stroke="#FFBD59" stroke-width="1.5" fill="rgba(255,189,89,0.07)" opacity="0.85"/>
  <!-- Document lines -->
  <line x1="462" y1="252" x2="516" y2="252" stroke="#FFBD59" stroke-width="1"   opacity="0.5"/>
  <line x1="462" y1="262" x2="514" y2="262" stroke="#FFBD59" stroke-width="1"   opacity="0.38"/>
  <line x1="462" y1="272" x2="509" y2="272" stroke="#FFBD59" stroke-width="1"   opacity="0.28"/>
  <!-- Accent dot on document -->
  <circle cx="510" cy="245" r="3" fill="#FFBD59" opacity="0.7"/>

  <!-- Arms reaching toward document -->
  <line x1="440" y1="248" x2="457" y2="258" stroke="#FFBD59" stroke-width="1.5" opacity="0.55" stroke-linecap="round"/>
  <line x1="512" y1="248" x2="521" y2="258" stroke="#FFBD59" stroke-width="1.5" opacity="0.55" stroke-linecap="round"/>

  <!-- Connection line between people at bottom -->
  <line x1="416" y1="310" x2="536" y2="310" stroke="#FFBD59" stroke-width="1" opacity="0.2" stroke-dasharray="4,4"/>
  <circle cx="416" cy="310" r="4"   fill="#FFBD59" opacity="0.5"/>
  <circle cx="476" cy="310" r="3"   fill="#FFBD59" opacity="0.3"/>
  <circle cx="536" cy="310" r="4"   fill="#FFBD59" opacity="0.5"/>

  <!-- Small floating metrics beside people -->
  <!-- Metric bubble 1 -->
  <rect x="358" y="148" width="38" height="22" rx="11" fill="rgba(255,189,89,0.1)" stroke="#FFBD59" stroke-width="0.8" opacity="0.6"/>
  <text x="377" y="163" font-family="'DM Sans',sans-serif" font-size="9" font-weight="700" fill="#FFBD59" opacity="0.9" text-anchor="middle">+38%</text>

  <!-- Metric bubble 2 -->
  <rect x="556" y="148" width="52" height="22" rx="11" fill="rgba(255,189,89,0.1)" stroke="#FFBD59" stroke-width="0.8" opacity="0.6"/>
  <text x="582" y="163" font-family="'DM Sans',sans-serif" font-size="9" font-weight="700" fill="#FFBD59" opacity="0.9" text-anchor="middle">100h+</text>

  <!-- Section label -->
  <text x="390" y="434" font-family="'DM Sans',sans-serif" font-size="8" font-weight="700" letter-spacing="2.5" fill="#FFBD59" opacity="0.4">COLLABORATION</text>

  <!-- === DECORATIVE CORNERS === -->
  <!-- Top-left -->
  <line x1="28" y1="28" x2="72" y2="28" stroke="#FFBD59" stroke-width="1" opacity="0.3"/>
  <line x1="28" y1="28" x2="28" y2="72" stroke="#FFBD59" stroke-width="1" opacity="0.3"/>
  <!-- Bottom-right -->
  <line x1="568" y1="472" x2="612" y2="472" stroke="#FFBD59" stroke-width="1" opacity="0.3"/>
  <line x1="612" y1="428" x2="612" y2="472" stroke="#FFBD59" stroke-width="1" opacity="0.3"/>

  <!-- Floating ambient dots -->
  <circle cx="355" cy="108" r="2"   fill="#FFBD59" opacity="0.25"/>
  <circle cx="378" cy="130" r="1.5" fill="#FFBD59" opacity="0.18"/>
  <circle cx="342" cy="148" r="1"   fill="#FFBD59" opacity="0.12"/>
  <circle cx="610" cy="195" r="1.5" fill="#FFBD59" opacity="0.18"/>
  <circle cx="590" cy="145" r="2"   fill="#FFBD59" opacity="0.14"/>
  <circle cx="50"  cy="108" r="1.5" fill="#FFBD59" opacity="0.14"/>
  <circle cx="295" cy="60"  r="1.5" fill="#FFBD59" opacity="0.12"/>
  <circle cx="310" cy="440" r="1"   fill="#FFBD59" opacity="0.1"/>

</svg>
